name: tervory-browser

services:
  tervory-browser:
    build: .
    image: tervory-browser:owned
    container_name: tervory-browser
    restart: unless-stopped
    environment:
      TERVORY_BROWSER_PORT: "8796"
      TERVORY_BROWSER_TOKEN: "${TERVORY_BROWSER_TOKEN:-}"
      CHROME_PATH: /usr/bin/chromium
    ports:
      - "127.0.0.1:8796:8796"
    shm_size: "2g"
